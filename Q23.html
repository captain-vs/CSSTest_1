<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

  .box{
            height: 70px;
            width: 70px;
            margin: 10px;
        }

    .container1 {
           
          background-color: grey;
          display: flex;
          flex-direction: column;
        }

        .container2 {
           
          background-color: grey;
          display: flex;
          justify-content: center;
        }
    </style>
</head>
<body>
    

        <h1>Flex Direction - Column</h1>
    <div class="container1">
        <div class="box" style="background-color: red;">Box 1</div>
        <div class="box" style="background-color: blue;">Box 2</div>
        <div class="box" style="background-color: green;">Box 3</div>
        <div class="box" style="background-color: aqua;">Box 4</div>
    </div>

        <h1>Justify Content - center</h1>
    <div class="container2">
        <div class="box" style="background-color: red;">Box 1</div>
        <div class="box" style="background-color: blue;">Box 2</div>
        <div class="box" style="background-color: green;">Box 3</div>
        <div class="box" style="background-color: aqua;">Box 4</div>
    </div>


</body>
</html>
